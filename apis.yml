name: Optimyze
description: >-
  Optimyze (Optimyze.cloud Inc.) was a Zurich, Switzerland based continuous-profiling
  startup, seeded by Andreessen Horowitz (a16z) in 2020, and the maker of Prodfiler — a
  whole-system, eBPF-based continuous profiler that observed CPU and memory usage down to
  the individual line of code across C/C++, Rust, Go, PHP, Python, Java, Scala, Ruby and
  Perl, with roughly 1% CPU overhead and no source-code changes or on-host debug symbols.
  Optimyze was acquired by Elastic N.V. in October 2021 and its Prodfiler technology was
  folded into Elastic Observability as Elastic Universal Profiling. The independent company
  no longer operates: the optimyze.cloud domain no longer resolves, the GitHub organization
  was archived in 2024, and the Prodfiler developer sub-sites (documentation, app, community)
  are offline. No independent public Optimyze API, OpenAPI definition, SDK, or developer
  portal exists to enrich; this profile is retained as an acquired-company lead.
